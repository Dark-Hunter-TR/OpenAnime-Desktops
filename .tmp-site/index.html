eatedAt:1737103847247,_id:"678a19e7374435282f34b81a"},{id:"7279430338890174951",author:"7277468703829004481",rating:10,title:"PEAK ANIME",content:"KESINLIKLE IZLENMESI GEREK ABI COK İYİ bunu müzik hayranı olan biri olarak söylüyorun o gitar çaldığı sahnelerin herbiri birbirinden iyi o sololar bayılıyorum şu gitar sesine sen nasıl bi yapımsın 12 bölümlük bir anime ama uzun olan çoğu animeden daha çok yer etti kalbimde kesinlikle öneririm tek sevmediğim kısım bir yerde kendini kaptırıp kendi başına gitar çaldığı kısım olsaymış bide yeni gitarını çaldığını göremedik üzücü",createdAt:1737215836867,_id:"678bcf5c18d3c73c1b132f4b"},{id:"7279880203004810606",author:"7271125022788292614",rating:10,title:"Baş yapıt",content:"gelmiş geçmiş en iyi günlik hayat animesi olabilri karakterin hikayesi ve sorunları hem üzücü hemde komik detaylarla çok iyi anlatılmış herhangibir müzik türüyle alakam olmaması ve dinlemeyi sevmeme rağmen bu animedeki müzikler efsane geldi her karakteri ayrı ayrı seviyorum özelliklede ana karakter her bölümü ayrı bir eğlence dram komedi her duyguyu yaşatıyor son detay olarak hiç erkek yok düşünmeden izleyin",createdAt:1737323092830,_id:"678d72545d06fcce66b85dcb"},{id:"7282293496621306312",author:"7278257334508329028",rating:9,title:"İzleyin",content:"Bu anime Türkiye'de değeri cidden bilinmiyor. O hafif dramsı hava o arkadaşlık ilişkileri, Bocchi'nin içimizden biri olması ve hikaye ana fikrinin güzel komedi ile harmanlanıp sunulması çok güzel. Kızların hikayesi deyip geçmek ayıp olur yani. Empati yaptırabildiği için ana karakterle güzel sarıyor. Şans verin izlkeyin arkadaşlar. Her sene gelmiyor böyle akıp giden animeler. İzlemediyseniz kesin izleyin.",createdAt:1737898466865,_id:"679639e22e4a9433a1e601c8"},{id:"7302261975495479538",author:"7279430872795714028",rating:9,title:"Cringe",content:"Animenin olayı kızın değişik hallere girmesi bu komık ama bazen cringe oluyo neden asosyal olduğunu düzgün açıklasa veya duygularını en azından aktarabilse mükkemmel olurmuş komedisi çok güzel ve çizim tarzı mekan tarımlarda güzel ama fazla bir olayı yok komedisi güzel komedi için izlenir                                                                                                                    s",createdAt:1742659323225,_id:"67dedefb0f9ccdcfe5a2006e"},{id:"7310199647765533491",author:"7310182533709173533",rating:10,title:"Bocchi the Rock!",content:"Bu animeyi övmekle bitiremem çünkü bu bir anime değil, tanrısal bir deneyim. Bocchi'nin varlığı sinir sistemime patch atıyor, her breakdown sahnesiyle bilinçaltım resetleniyor. Bocchi the Rock! beni ruhsal olarak darmadağın edip sonra Kessoku Band ile tekrar inşa ediyor. İzlerken beynimde nöronlar mosh pit yapıyor. Her bölüm sonrası hayata devam etmek için kendimi ikna etmem gerekiyor. Bu kadar estetik, bu kadar içe dokunan, bu kadar özgün bir şeyin aynı anda var olabilmesi fizik kurallarına aykırı. Bu animeyi izlemek, kendi ruhunun içine bakmak gibi. Korkutucu ama bağımlılık yapıyor. Ve evet, Bok gibi hissettiren her şeyin ilacının adı artık belli: BOCCHI. THE. ROCK. ! izlemek, ruhunu ekranın içine çürütmek gibidir. Bocchi'nin her panik atak anı, içimdeki tüm güvensizliği, kaygıları parçalayıp beynimin en derin köşelerine sızıyor. Anlatamam! Adamlar animasyonla ruhumu paramparça etti. Düşünsene, bir kızın sahnede gitar çalıp panik atak geçirirken ***senin içindeki boşluğu bulması, evrende bir yerlerde sana dokunması... Sadece bu yüzden ölüme bile razı olursun. Kessoku Band’in müziğiyle beynim geri sayım yapıyor, \"sosyal anksiyetemi aşacağım\" diye içimdeki tüm varlıkları dövüyor. Ve sonra? Sonra ekranıma bakıyorum, gözlerimden yaşlar süzülsün diye programlanmış bir yapay zeka gibi... Bu anime, sadece bir animasyon değil, ***insanın beynine son derece çarpık bir şekilde “artık hayatla barış, ama bir daha asla iyi hissetme” diyen bir deney. Hani şu sahnede Bocchi'nin gülmeye çalışıp ağlaması var ya, evet, işte o an, \"ne kadar sağlam bir acı bu!\" diye bağırmak istiyorsun, çünkü bu gerçekten her şeyin sonu, ama aynı zamanda her şeyin başlangıcı.",createdAt:1744551811769,_id:"67fbbf83df03b9dda84ac8cc"},{id:"7337777595699695639",author:"7293575811066499287",rating:7,title:"Çıtırlık",content:"Yani kısaca anlatmak gerikirse komedi ve müziğin bir araya getirilmesinden oluşuyor ve çok iyi bir şekilde sosyal ankastreyi konu alıyor.Yorumlarda çok övülmüşte bana çok hitap etmedi o kadar ama güzel bir anime. İzlemek istiyosanız 12 bölümlük çıtır bi anime. Komedi ve müziği sevenine feci sarar büyük ihtimal.                                                                                                  .",createdAt:1751126906930,_id:"6860137ac9766a7575f9d7a2"},{id:"7340690838902542841",author:"7340683871622533607",rating:8,title:"Güzel ve tadında",content:"Eğer gitar çalıyorsanız çok iyi bilirsiniz belli bir seviyeye geldikten sonra artık o gitar size klavyeleri dar gelir penayı her vurduğunuz da daha iyisini yapabilirim diyip gaza gelip tel kopartmalar ulan alsammı diyip 7-8 telli gitarlara cam arkasından bakmalar :) Çalarken söylemeler ama bunu sesin kötülüğünden dolayı tek başınayken yapmalar.Bocchi izlerken gitar çalan ve daha çük müzikal animeleri izlemiş biri olarak bocchi hem komedi unsuru hem karakterlerin sıkıcı olmayışı tadında muzikali ile gayet güzel bir seri he evet elektro gitar çalıyorsanız veya bateri tutkunuz varsa alınan keyif daha da artıyor.",createdAt:1751821478235,_id:"686aaca699e75a5497cf0619"},{id:"7342215286759624795",author:"7280112949828522137",rating:9,title:null,content:null,createdAt:1752184934927,_id:"68703866bfc4d2d7ed8735f1"},{id:"7346677329764029235",author:"7330798547421369386",rating:9,title:"Seveni var",content:"10/10\nMükemmel.\nTürkiyede çok seveni var, değeri pek biliniyor ama cidden çok iyi. Müzikle alakanız var veya yok fark etmez izleyin izlettirin. Hem komedisiyle hem müthiş müzikleriyle sizi içinde tutan, karakterlerine bağlanacağınız, özellikle ana karakterin hem üzücü geçmişi hem gülünç tepkilerine, dden yaran cinsten. farklı animasyon teknikleri kullanmışlar özellikle o sahneler cok hosuma gitti, müziğe de ilginiz varsa mutlaka izleyin. şarkıları baya iyi yapmışlar bir kaç tanesini oturdum çıkardım güzel pratik oldu bana da.",createdAt:1776655733887,_id:"69e59d75bdaf4ac3c1882b32"},{id:"7447150062041306321",author:"7434253880000516106",rating:10,title:null,content:null,createdAt:1777203334948,_id:"69edf886d7353ff446d2d599"},{id:"7456593773426905732",author:"7429961628566690193",rating:10,title:null,content:null,createdAt:1779454891198,_id:"6a1053aba041e0e3faca5763"},{id:"7487901344989188807",author:"7484603567655886090",rating:10,title:null,content:null,createdAt:1786919197925,_id:"6a82391dfaa836e9315f7d70"},{id:"7489318150383603868",author:"7429569098993899499",rating:10,title:null,content:null,createdAt:1787256990654,_id:"6a87609e9020e69aaa0733e2"},{id:"7490409610994522226",author:"7454103397495478509",rating:10,title:"Adım Düşüncelerimi Açıklamaya Yeterlidir Herhalde",content:"Bu anime için yapabileceğim hiçbir inceleme beni tatmin etmeye yetmiyor o yüzden sadece 200 karakteri doldurmak için Aynı Şeyi Tekrarlayacağım Bocchi the Rock! Bocchi the Rock! Bocchi the Rock! Bocchi the Rock!",createdAt:1787517215142,_id:"6a8b591f14046f05100f5175"},{id:"7494407835648793035",author:"7433857403633799884",rating:10,title:null,content:null,createdAt:1788470466183,_id:"6a99e4c2f792b187bf1e4066"},{id:"7501978914059720695",author:"7501974046079195102",rating:9,title:null,content:null,createdAt:1790275551940,_id:"6ab56fdf52496a0e0789fbdd"},{id:"7503129070129910115",author:"7407847813679157329",rating:9,title:"Gardıroptan Sahneye Uzanan Saf Anksiyete Resitali",content:"\"Minnoş kızlar çay içip müzik yapıyor\" klişesini alıp, gardırobun karanlığında gitar çalan içedönüklükte artık bir marka olan bir gencin gerçekçi panik ataklarıyla birleştiren modern bir başyapıt. Özellikle The Promised Neverland 2. Sezon rezaleti sonrası CloverWorks’ün adeta günah çıkardığı; yer yer kısıtlı bütçeyi bile tembellikle değil, sektöre ders niteliğinde özgün bir görsel dehaya çevirdiği muazzam bir büyüme hikâyesi.\n\nArtılar:\n• Kendi Gözünden Yaşanan Çiğ ve Yaratıcı Anksiyete: Türün o yapmacık \"birazcık utangaç cici kız\" sahteliğine asla sığınmıyor. Bocchi’nin yaşadığı buhranları süslemek yerine, krizi doğrudan onun zihninden ve kendi gözlerinden deneyimliyoruz. Düşük poligonlu PS1 grafiklerinden, kil hamurlu stop-motion’a ve gerçek çekim video kolajlarına kadar uzanan o deneysel delilik, sektöre uzun yıllar ilham verecek bir yönetmenlik başarısı.\n• Karikatürleşmeyen, İnce İşlenmiş Karakter Yazımı: Grup üyeleri içi boş \"moe\" şablonları olarak kalmıyor; her biri sahici, kendi kusurları olan ve Bocchi’nin anksiyetesini zorla değiştirmeye çalışmak yerine ona alan tanıyan olgun bir empatiyle yazılmış. Nijika’nın omurga olan ablalığı (her ne kadar ailesinin küçük kardeşi olsa da), Ryo’nun absürt ama dürüst müzisyenliği ve Kita’nın toksik olmayan dışadönüklüğü, ekibin kimyasını türün çok üstüne çıkarıyor.\n• Bütçe Kısıntısını Tarza Çeviren Akıl: Bütçenin zorlandığı ya da yetmediği yerlerde animasyonu kısmak yerine, bunu bir avantaja çevirip birbirinden zıt sanat tarzlarıyla harmanlamaları esere inanılmaz taze bir soluk getirmiş.\n• Bocchi'nin Ruhundan Çıkan Şarkılar: Müzikler stüdyoda sipariş üzerine yazılmış steril jenerik anime popu gibi durmuyor; bizzat Bocchi’nin o bastırılmış, yalnız dünyasından fırlamış gibi hissettiriyor. Çaldığı her akorda karakterin emeğini duyuyorsunuz; nitekim bazı parçalarını doğrudan şahsi çalma listeme ekletmeyi başardı.\n\nEksiler:\n• Bocchi'nin Gölgesinde Kalan Kadro: Bocchi’nin karakter gelişimi ve ekran aurası o kadar baskın ki; Nijika, Ryo ve Kita’nın kişisel hikâyelerine, arka planlarına biraz daha derinlemesine alan açılmasını ve ekranda daha fazla yer bulmalarını isterdim.\n• Arayı Fazla Soğutan Yeni Sezon Takvimi: Bu denli devasa bir etki yaratan eserin devam sezonunun arayı bu kadar açması ve duyurusunun gereksiz yere uzatılması serinin yakaladığı o organik heyecanı biraz yıpratıyor.\n\nSonuç:\nSosyal anksiyeteyi ajitasyona boğmadan, absürt görsel mizah ve safkan bir müzikal tutkuyla anlatan istisnai bir iş. Yan karakterlere biraz daha odaklanılsa ve devamı bu kadar bekletilmese doğrudan 10/10 zirvesine otururdu; fakat bu haliyle bile müzik türünün son yıllardaki en özgün işi: Taş gibi bir 9/10.",createdAt:1790549770516,_id:"6ab99f0a994dec747523130e",quality:{approved:true,detail:1,informative:1,genuine:.96,model:"jev-1.13.0",evaluatedAt:1793309706530}},{id:"7517202770915498385",author:"7484625140269981071",rating:9,title:null,content:null,createdAt:1793905202260,quality:null,_id:"6aecd2327debbb6fdb6171c2"}],is4K:true,selectedEpisodeGroupId:null,malRating:8.72},{type:"tv",episodeRuntime:25,adult:false,inProduction:false,tmdbID:204635,malID:52215,pictures:{banner:"https://image.tmdb.org/t/p/original/o5GDX8zmKLpOxRkBoAonoQL8gbg.jpg",avatar:"https://image.tmdb.org/t/p/original/crV1eBtpI5F4nlMwzrBrh4zZuFV.jpg"},logos:[{aspect_ratio:1.403,height:566,iso_3166_1:"CN",iso_639_1:"zh",file_path:"/buVmoonnduVz3vCReXek1UtUQZe.png",vote_average:3.334,vote_count:1,width:794,file:"https://image.tmdb.org/t/p/original/buVmoonnduVz3vCReXek1UtUQZe.png"},{aspect_ratio:2.845,height:451,iso_3166_1:"RU",iso_639_1:"ru",file_path:"/3JZzoSDvM8yXWTzMLXUrHXXJYrM.png",vote_average:3.334,vote_count:1,width:1283,file:"https://image.tmdb.org/t/p/original/3JZzoSDvM8yXWTzMLXUrHXXJYrM.png"},{aspect_ratio:1.683,height:540,iso_3166_1:"DE",iso_639_1:"de",file_path:"/ztrJaMQuD8kY1KXGCqxVSYZkmAW.png",vote_average:3.334,vote_count:1,width:909,file:"https://image.tmdb.org/t/p/original/ztrJaMQuD8kY1KXGCqxVSYZkmAW.png"},{aspect_ratio:2.353,height:544,iso_3166_1:"FR",iso_639_1:"fr",file_path:"/yOSaA0Wzlo30jVfvGlEsgtQP9Qr.png",vote_average:3.334,vote_count:1,width:1280,file:"https://image.tmdb.org/t/p/original/yOSaA0Wzlo30jVfvGlEsgtQP9Qr.png"},{aspect_ratio:3.051,height:409,iso_3166_1:"RU",iso_639_1:"ru",file_path:"/nU23Mrj ealous","philosophical","introspective","psychological","inspirational","science","approving","defiant","dignified"],malWebsites:[],id:"7280443288111290362",reviews:[{id:"7280611603144252150",author:"7268889705331036182",rating:10,title:"ŞAHESER",content:"Orta çağ döneminde dini,batıl inanışların çoğunluk gösterdiği zamanlarda, genç bir çocuğun güneşve dünya ile ilgilü öğrendiklerinin ustası sayesinde öğrenilerinin çatıştığını anlayan Rafal adlı dahi çocuğun araştırmalarını görüyoruz.\n\nhikayesi, dünya tasarımı yukarıda yazdığım gibi her animede bulunmayan nadide bir eser, keşke böyle animelerde çıksa dediğim heyecan ve merak uyandıran tarzdan. keşke animasyonlara daha çok önem gösterseymişler... ama yinede bu serinin şaheser seviyede olmamasının bi sebebi değil çübkü anime öyle bişey vaad etmedi, izleyen kişide anlayabilir. animedeki her karakter olmasada ana karakterlerin(Rafal,nowak ve oczy) ve bazı yan karakterlerin(gras ve piast) gibi fikirlerin çatışması beni çok heyecanlandırmıştı.\n\nYeni başlayacaklar için spoiler bulundursada yinede Openningleri izleyin, emin olun pişman olmazsınız bunu dediğime.\nMüzikleri okadar hoş ve ilgi çekici değil yakıştıramadım\n\nintikam ya da ona benzer manüplatif, bol aksiyon bekler bi şekilde izlerseniz hiçbirşey anlamazsınız, seride çok güzel bir ders yatıyor, o dersi anlatamam izleyerek siz görüceksiniz zaten. hikayesi çok güzel olduğu için herkes beğenmeyebilir ama içinde çok güzel birşey vaadeden bir anime, son cümlede yazdıklarımı okuyupta o gözle bakarsanız şaheser tadındadır. izleyin izletin izlettirin.",createdAt:1737497472212,_id:"67901b801fc8d93a39305b3a"},{id:"7290086158892011628",author:"7276121677484790059",rating:10,title:"İzlediğim en kaliteli animelerden biri",content:"Anime orta çağda katolik rejimin nasıl yıkıldığını dönem dönem bize gösteriyor, ayrıca bir yandan hayatını bir amaca adayan insanların hırslarını ve çabalarını göstererek izleyiciyi ekrana bağlıyor. Animede spesifik bir ana karakter yok, her opening'in başında gözüken kimse o bölüm ana karakter odur 20 bölümde toplam 3 kere ana karakter değişti aşağı yukarı, ve gerçekten ekrana kitlenip izledim soluksuz 2 günde bitirdim 20 küsür bölümü. Hayatımda izlediğim en güzel 5 anime arasına açıkça girer.",createdAt:1739756382331,_id:"67b2935e26f6838a3df09234"},{id:"7390330942511912012",author:"7268609655000010755",rating:10,title:"Başyapıt",content:"Herkese hitap etmeyebilir ancak, karakterleriyle, olay örgüsüyle ve vermek istediği mesaj ile beni çok etkiledi. En çok hoşuma giden şey benimle aşağı yukarıı aynı mantık ve düşünce ile bunu anlatmasıydı. Ayrıca anime boyunca bir ana karakterden çok bir konu üzerinden ilerlemesi ve her ana karakter diyebileceğimiz karakterin bu konu için daha doğrusu amaç için farklı motivasyonlar ile olsa da savaşması da hoşuma giden şeylerden biri. En çok da olay örgüsünü başlatan Rafal karakterini sevdim.\n\nKesinlikle izleyin, bir şans verin.",createdAt:1763656601204,_id:"691f4399b4f0556af5b3a6e8"},{id:"7401658511840514168",author:"7274818206496198739",rating:10,title:null,content:null,createdAt:1766357304188,_id:"6948793854b2b78ed5eaff66"},{id:"7490417733880780978",author:"7277701344868175960",rating:10,title:null,content:null,createdAt:1787519151789,_id:"6a8b60af14046f05102c64cf"},{id:"7509953802011677416",author:"7287062286974325883",rating:10,title:"...",content:"Astrolojiye ilginiz olmasa fav. animeleriniz arasına gireceğine eminim \nmükemmel yeterli olmayabilir kesinlikle izleyin ................................................................................",createdAt:1792176913394,quality:{approved:false,detail:.07666666666666667,informative:.35000000000000003,genuine:.56,model:"jev-1.13.0",evaluatedAt:1792177058023},_id:"6ad2731130deb85542d6d043"}],selectedEpisodeGroupId:null,is4K:true},{type:"tv",episodeRuntime:24,adult:false,inProduction:false,tmdbID:88806,malID:39071,pictures:{banner:"https://image.tmdb.org/t/p/original/73A148n9q7TKX9gBZj8WW0s4HVU.jpg",avatar:"https://im ly, Momo Chiyoda happens to be Yuuko's classmate at Sakuragaoka High and is much stronger than her in both strength and endurance. Taking pity on her wimpy assailant, the magical girl agrees to train Yuuko and help her unlock her dormant powers. Now, Yuuko must rise up and defeat her generous frenemy to save her family from the terrible grip of poverty.",poster_path:"/aiCKnI1Nz13wAalIIqDQOX12k84.jpg",poster:"https://image.tmdb.org/t/p/original/aiCKnI1Nz13wAalIIqDQOX12k84.jpg",vote_average:6.6},{id:"61b0b6ad5800c40042496191",mal_id:42745,air_date:"2022-04-08",episode_count:12,name:"Season 2",tmdb_season_number:2,season_number:2,networks:[{id:160,logo_path:"/lUACMATs6jcscXIrzNCQzbvNVN5.png",name:"TBS",origin_country:"JP"}],overview:"Our favorite supernatural powerhouse, Shamiko, AKA Shadow Mistress Yuko, aims to break the curse placed on her family by the Clan of Light. Along the way, she forms an unlikely allegiance with Momo, a rival from the Light Clan! They'll need to work together to find another magical girl who's gone mysteriously missing, and what this? There's a dangerous force lurking somewhere in the city, plus Shamiko's mysterious father might be closer than she thinks?",poster_path:"/ljCaFNOjDHqMDt49ec9xBHsuhds.jpg",poster:"https://image.tmdb.org/t/p/original/ljCaFNOjDHqMDt49ec9xBHsuhds.jpg",vote_average:6.6}],nextEpisodeToAir:null,productionCompanies:[{id:11884,logo_path:"/tHzHPSKdmLT5zCdqFbcmHzZvRIc.png",name:"J.C.STAFF",origin_country:"JP"},{id:1393,logo_path:"/lUACMATs6jcscXIrzNCQzbvNVN5.png",name:"TBS",origin_country:"JP"},{id:9148,logo_path:"/rtW3NadfF4kR5mTW00ahiFxw6k7.png",name:"Pony Canyon",origin_country:"JP"},{id:118502,logo_path:"/JQ5bx6n7Qmdmyqz6sqjo5Fz2iR.png",name:"BS11",origin_country:"JP"},{id:163695,logo_path:"/ktRrqMfqbdVT87FKNiGTLXAsxeu.png",name:"Medicos Entertainment",origin_country:"JP"},{id:157471,logo_path:"/sWoNzrlMtRH8p3zKayLfOaTNmiG.png",name:"Nichion",origin_country:"JP"},{id:81209,logo_path:"/4I2wT82jKeHQ7HzmdNqBFYJK44j.png", st bi yapım. Sürekli reddedilen çaylak bi manga çizerinin sosyal medya anketlerine güvenerek çıktığı bu plansız yolculuklar aslında hepimizin hayatındaki o \"tıkanmışlık\" hissini çok iyi yakalıyor bence.\n\nAnimenin en büyük artısı seyahatleri bi kaçış rampası gibi göstermemesi. Chika geziyor görüyor ama sorunları sihirli bi şekilde çözülmüyor yani anime bize o gerçekçi melankoliyi ve çabalamanın getirdiği yorgunluğu çok iyi aktarmış. Ama madalyonun diğer yüzünde ciddi bi tempo sorunu var abi. Seri sakinlik ve doğallık dozunu bazen o kadar artırıyor ki hikaye anlatımı tamamen durağanlaşıyor bi süre sonra. Manzaralar tatlı yerel kültür sunumları keyifli ama olay örgüsü kendini tekrar eden bi döngüye giriyor. Karakter dinamikleri ne izleyiciyi tam anlamıyla içine çekecek kadar derinleşebiliyor ne de türe yeni bi soluk getiriyor.\n\nSonuç: Karşımızda ne bir başyapıt var ne de vakit kaybı. Eğlenceli kafa yormayan arkada akıp giderken içinizi ısıtacak ama bittiğinde hafızanızda çok büyük izler bırakmayacak cinsten dürüst bi \"mola\" animesi. Beklentiyi arşa çıkarmadan çayınızı kahvenizi alıp izleyebilirsiniz",createdAt:1783879845934,_id:"6a53d8a549f95c5509f60800"}],selectedEpisodeGroupId:null},{type:"tv",episodeRuntime:24,adult:false,inProduction:false,tmdbID:134742,malID:49894,pictures:{banner:"https://image.tmdb.org/t/p/original/7NXMz4qtIT608BIQx3pL4nsD24S.jpg",avatar:"https://image.tmdb.org/t/p/original/xf3k3EZzGWCpO68LWFgI8boryw5.jpg"},logos:[{aspect_ratio:3.688,height:324,iso_3166_1:"US",iso_639_1:"en",file_path:"/v7dOuHznpYTQFnsjvwY4PwKPOFS.png",vote_average:3.334,vote_count:1,width:1195,file:"https://image.tmdb.org/t/p/original/v7dOuHznpYTQFnsjvwY4PwKPOFS.png"},{aspect_ratio:2.912,height:295,iso_3166_1:"US",iso_639_1:"en",file_path:"/sNFpPQTR0wbMwqRMjcijrcYFEEs.png",vote_average:.166,vote_count:1,width:859,file:"https://image.tmdb.org/t/p/original/sNFpPQTR0wbMwqRMjcijrcYFEEs.png"},{aspect_ratio:1.929,height:308,iso_3166_1:"US",iso_639_1:"en",file_path:"/46m0vmQGF "Romance"],summary:"Piano dahisi Arima Kousei, çocuk müzisyenler yarışmasını kazandıktan sonra herkes onun adını öğrenmiştir. Fakat; ona en çok destek veren annesinin ölümünden sonra zihinsel ve duygusal bir çöküş yaşayan Kousei, artık kendi piyanosunun sesini bile duyamaz olmuştur. Bu olayın üstünden iki sene geçtikten sonra bile, piyanoya dokunamayan Kousei, bütün yaşamını böyle gideceğini düşünürken tanıştığı bir kız her şeyi değiştirecektir.\n\nBaşına buyruk bir kemancı olan Miyazono Kaori, Kousei’nin müzik hayatına geri dönmesine yardım eder ve onu alışık olmadığı bir stilin içine sürükleyerek yeni şeyler keşfetmesini sağlar.\n\nHikâyemiz, ikilinin ve arkadaşlarının müzik ile yaşadıkları maceraları konu alıyor.\n\nAynı adlı mangasından uyarlanmıştır.",firstAirDate:"10.10.2014",lastAirDate:"20.03.2015",seasons:[{id:"5728d009c3a3681d9f0004d9",mal_id:28069,air_date:"2015-05-15",episode_count:1,name:"Specials",tmdb_season_number:0,season_number:0,poster:"https://image.tmdb.org/t/p/original/IGbeFv5Ji4W0x530JcSHiQpamY.jpg",poster_path:"/IGbeFv5Ji4W0x530JcSHiQpamY.jpg",overview:"",networks:[{id:1,logo_path:"/4x4GsmRmSLLL0RVNKsoqAVH43tz.png",name:"Fuji TV",origin_country:"JP"}],vote_average:0},{id:"547cc3a39251412d7500307c",mal_id:23273,air_date:"2014-10-10",episode_count:22,name:"Season 1",tmdb_season_number:1,season_number:1,poster:"https://image.tmdb.org/t/p/original/7hDUNtU0oQTylEAjVX9936hWkiw.jpg",poster_path:"/7hDUNtU0oQTylEAjVX9936hWkiw.jpg",overview:"",networks:[{id:1,logo_path:"/4x4GsmRmSLLL0RVNKsoqAVH43tz.png",name:"Fuji TV",origin_country:"JP"}],vote_average:6.9}],nextEpisodeToAir:null,productionCompanies:[{id:13113,logo_path:"/xV5tPYKZhP2Ko9dOh5A3FahuKsx.png",name:"A-1 Pictures",origin_country:"JP"},{id:2883,logo_path:"/rDYExnBV61jGQnkhVVrPN4Yl7O1.png",name:"Aniplex",origin_country:"JP"},{id:1778,logo_path:"/b5rT6VbYza3LyfltCmz1OcqzWJM.png",name:"dentsu",origin_country:"JP"},{id:3341,logo_path:"/dTG5dXE1kU2mpmL9BNnraffckLU.png",name:"Fuji Television Network em ama bu anime beni izlediğim zaman etkisi altına almıştı. Bir kaç tane yapım daha denedi ama kesinlikle bu kadar başarılı olmadı bence iyi bir yapım türü sevmeyen kişiyi bile içine çekmeli ve evet bu yapım beni kalbimden vurdu. İzleyin, izlettirin.",createdAt:1737305784033,_id:"678d2eb85d06fcce66aa14e1"},{id:"7280154597761487386",author:"7279402768702378279",rating:10,title:"Nisan Ayını İple Çekiyorum🎻💕🎹",content:"Bu animeyi o kadar çok seviyorum ki hislerimi metne dökmüştüm. 4 Sayfa gibi bir metin ortaya çıktı. Buraya birkaç cümle ile aktarmam imkansız.\n\nHikayeden bahsetmeyeceğim. Kendiniz deneyimlerseniz daha iyi olur.\n\nBu animenin en iyi olduğu kısım kesinlikle sunum. Hikayeyi kafanızda özetlediğinizde pek ilgi çekici olmayan bir şey ortaya çıkıyor. Fakat o kadar iyi sunmuşlar ki kafanızda özetlediğinizde ortalama hissettiren hikaye, bir şahesere dönüşüyor.\n\nHatta animeyi izledikten 1 yıl sonra falan kendime \"Ben bu animenin neyini seviyorum?\" diye bir soru sordum. Hikayeyi kafamda özetlediğimde az önce söylediğim gibi ortalama bir iş gibi hissettirdi. Fakat tekrar izlediğimde ilk seferimden bile daha çok sevdim.\n\nSunumun bu kadar iyi olmasının en büyük sebebi müzikler. OP'ler, Endingler, anime içinde kullanılan müzikler. Hepsi harika. Animeyi bitirdikten sonra o müzikleri dinleyince duygulanmamak imkansız.\n\nAnimenin çizimlerini çok seviyorum. Renk paleti de gayet güzel. Renk paletinin hikayenin gidişatına göre değişmesi güzel bir hava katmış.\n\nKarakterlerde gayet iyi. Tek sıkıntı, animede biraz fazla karakter olması. Ana karakterleri görmek isterken tüm bir bölümün yan karakterlere odaklanıldığını görünce insan sıkılıyor.\n\nBu anime yüzünden sürekli nisan ayını iple çekiyorum. Nisan gelse de tekrar izlesem. Umarım hiç sıkılmam.",createdAt:1737388513638,_id:"678e71e11fc8d93a39f8b0b3"},{id:"7280216028502562010",author:"7280073499362727811",rating:10,title:"İntihar Bahanesi!",content:"!AZICIK SPOLİER!\nEğer benim gibi kısa mutlu ship videolarandan le bezeli bu tek sezonluk anime, piyanodaki genç bir yeteneğin hayatına yeniden renk katışını şiirsel bir dille anlatıyor. Annesinin ölümü sonrası tuşlara dokunamaz hâle gelen Kousei Arima’nın dünyası, enerjik kemancı Kaori Miyazono ile tanışmasıyla bambaşka bir yola giriyor. Hikâye; sanatın iyileştirici gücünü, dostluğun ve ilk gençlik duygularının getirdiği dönüşümü incelikle işliyor.\n\nArtıları\n\nMüziğin Anlatım Gücü: Klasik eserler sadece arka plan değil; karakterlerin iç dünyasını hissettiren birer dil.\n\nGörsel Zenginlik: Pastel renkler ve sahne ışıkları, hem sahnedeki heyecanı hem de duygusal iniş çıkışları yansıtıyor.\n\nKarakter Gelişimi: Kousei’nin içsel yolculuğu ve çevresindeki dostluk bağları doğal ve inandırıcı bir ilerleyiş sunuyor.\n\nEksileri\n\nTempo Dalgalanmaları: Yan hikâyelere ayrılan bölümler, özellikle aksiyon arayan izleyiciler için yer yer yavaş gelebilir.\n\nYoğun Duygusallık: Duygusal anlatımın baskın oluşu, daha hafif tonda hikâyelerden hoşlananlar için zaman zaman ağır gelebilir.\n\nSon Söz\n\nYour Lie in April; kayıplarla yüzleşmeyi, yeniden ayağa kalkmayı ve sanatın dönüştürücü gücünü zarif bir üslupla aktaran etkileyici bir anime. Duygusal derinlik arayan izleyiciler için hem müzikal hem de görsel anlamda unutulmaz bir deneyim sunuyor.",createdAt:1758061665669,_id:"68c9e46193eb32c85d7e1095"},{id:"7401616391104630850",author:"7347636538445926638",rating:10,title:"Çok iyi bir animeydi.",content:"Çok iyi bir animeydi. Animasyon kalitesinin yanında müzikleri animeyi güzelleştiren şeydi.  Ayrıca dram ve hikaye anlatımı etkileyici bir eserdi. Anime izlemeye başladığım döneme dayanan güzel bir hatıraydı.",createdAt:1766347261822,_id:"694851fd54b2b78ed5d306e1"},{id:"7411716379646104764",author:"7292431661084448929",rating:10,title:null,content:null,createdAt:1768755286739,_id:"696d1056ac111d9b75140c68"},{id:"7424444294716461294",author:"7350497794366378135",rating:9,title:null,content:null,createdAt:1771789858165,_id:"699b5e22c820559eff0a han",originalName:"コウペンちゃん",turkish:"Koupen-chan",japanese:"コウペンちゃん",slug:"koupen-chan",summary:"Koupen-chan is an adorable baby emperor penguin who spreads positivity and cheer.",numberOfSeasons:1,tmdbScore:8,id:"7309476313859887582"},{type:"tv",malID:44406,pictures:{banner:"https://image.tmdb.org/t/p/original/xvW4vt825iB1cRKfNcQ8ilEDtdM.jpg",avatar:"https://image.tmdb.org/t/p/original/t4acTRObMh2VlSQWwZAxyS5pO1s.jpg"},romaji:"Da Wang Rao Ming",english:"Spare Me, Great Lord!",originalName:"大王饶命",turkish:"Spare Me, Great Lord!",japanese:"大王饶命",slug:"da-wang-rao-ming",summary:"Lü Shu, demir gibi bir iradeye sahip, zayıf bir gençtir. Ailesini kaybettikten sonra, geçimini sağlamak için çalışırken ve üvey kız kardeşi Lü Xiaoyu'ya bakarken prestijli bir liseye kaydolur. Ancak, bir araba kazası gizli xiulian süper güçlerini uyandırdığında, Lü Shu'nun sakin hayatı aniden değişir. Fiziksel zayıflığından kurtulmuş olan Lü Shu, xiulian sanatı hâlâ gizemini koruduğu ve xiulian uygulayıcılarının kaderi belirsiz olduğu için yeni keşfettiği yeteneklerini gizlemeye karar verir.\n\nBu arada, uygulayıcıları izlemekten sorumlu uluslararası vakıf Tian Luo Di Wang, planlarını harekete geçirir. Üyeleri Xi Fei'nin teşvikiyle, Lü Shu'nun lisesinde özel bir xiulian eğitim grubu kurulur. Lü Shu programa katılmak zorunda kalsa da, korkutucu gücünün doğasını gizlemeye kararlıdır, çünkü xiulian uygulaması sınırsız bir kaynaktan, yani başkalarının eylemlerinin yol açtığı olumsuz duygulardan beslenir.",numberOfSeasons:3,tmdbScore:7.696,id:"7344282866529866087"},{type:"tv",malID:61014,pictures:{banner:"https://image.tmdb.org/t/p/original/dANKBnapgjG7QmXeRZ6xQg8czX0.jpg",avatar:"https://image.tmdb.org/t/p/original/tAGKNFINnkQM73WbLFdQ7CvRdNN.jpg"},romaji:"Toaru Anbu no Item",english:"A Certain Dark Item",originalName:"とある暗部の少女共棲",turkish:"A Certain Dark Item",japanese:"とある暗部の少女共棲",slug:"toaru-anbu-no-item",summary:"In Academy City, psychic powers promise a brighter future. But beneath the city's peaceful surface lurks a merciless dark side. ITEM, an elite team of four girls with deadly abilities, carries out dangerous missions that can never see the light of day. When a fifth girl enters their lives, ITEM is drawn deeper into a world of violence, brutality, and moral corruption.",numberOfSeasons:1,tmdbScore:8.667,id:"7504787883648095459"},{type:"tv",malID:57181,pictures:{banner:"https://image.tmdb.org/t/p/original/8p39Ud6ZKMixBQ7R4frg2o3idzc.jpg",avatar:"https://image.tmdb.org/t/p/original/sN3TuYevEPWxZhwcp6I2PJRW1jl.jpg"},romaji:"Ao no Hako",english:"Blue Box",originalName:"アオのハコ",turkish:"Blue Box",japanese:"アオのハコ",slug:"ao-no-hako",summary:"Badminton oyuncusu Taiki, basketbol yıldızı Chinatsu'ya uzaktan da olsa hayranlık duymaktadır. Ancak bir bahar günü, şaşırtıcı bir gelişme onları beklenmedik şekilde yakınlaştırır.",numberOfSeasons:2,tmdbScore:7.9,id:"7241830162214424576"},{type:"tv",malID:61578,pictures:{banner:"https://image.tmdb.org/t/p/original/kuYMjcQ6BeLTBYUR1l1T8W8ZMcf.jpg",avatar:"https://image.tmdb.org/t/p/original/lpjQKu1KfceCLeO8ga71gwJMieg.jpg"},romaji:"Seitokai ni mo Ana wa Aru!",english:"Even the Student Council Has Its Holes!",originalName:"生徒会にも穴はある！",turkish:"Even the Student Council Has Its Holes!",japanese:"生徒会にも穴はある！",slug:"seitokai-ni-mo-ana-wa-aru",summary:"In a student council filled with weirdos, one new member is about to have a hell of a school year! Mizunoe Ume just wanted to avoid repeating a grade when he joined the student council. After all, it seemed like an easy fix to his current academic problems. But then, he met his fellow council members. Each of them is eccentric in their own way—one's an airhead, another's scary, one's secretly a pervert, but all in all, they're just really weird! Yet somehow, they're also oddly cute and endearing. Which means Mizunoe is stuck with them and all the chaos they bring to the table. Get ready for a slice-of-life story that's irresistibly charming, quirky, and a little bit naughty!",numberOfSeasons:1,tmdbScore:8.4,id:"7504787839482074338"},{type:"tv",malID:49052,pictures:{banner:"https://image.tmdb.org/t/p/original/87IQdOn34p1z2KTdM4IZ1N8bWaH.jpg",avatar:"https://image.tmdb.org/t/p/original/uvWHFUtgD0V8Xy5lolwijRAN82O.jpg"},romaji:"Ao Ashi",english:"Aoashi",originalName:"アオアシ",turkish:"Ao Ashi",japanese:"アオアシ",slug:"ao-ashi",summary:"Manga, Ehime bölgesinde yaşayan üçüncü sınıf ortaokul öğrencisi Ashito Aoi’yi konu alıyor. Ashito’nun güçlü bir futbol yeteneği vardır ama, onu gizlemeye çalışır. Çok dürüst kişiliği olmasından dolayı, onun için büyük bir aksilik yaratan felakete sebep olur. Daha sonra, güçlü J-Club takımı Tokyo City Esperion’un emektar futbolcusu ve kulübün genç takımının koçu Tatsuya Fukuya, Ashito’nun karşısına çıkar. Tatsuya, Ashito’yla karşılaşıp ondaki yeteneğini görür ve onu Tokyo’daki genç takımda denemek için davet eder.",numberOfSeasons:2,tmdbScore:7.8,id:"7340602249892073813"},{type:"tv",malID:34572,pictures:{banner:"https://image.tmdb.org/t/p/original/qu9epTZh29fGUkY7ZYc9PVsv0Ig.jpg",avatar:"https://image.tmdb.org/t/p/original/uZUtoVChBGhNj9OfrM2LYpwBm8E.jpg"},romaji:"Black Clover",english:"Black Clover",originalName:"ブラッククローバー",turkish:"Black Clover",japanese:"ブラッククローバー",slug:"black-clover",summary:"Asta ve Yuno aynı gün yetimhaneye terk edilmiş iki yetimdir. Çocukken birbirlerine meydan okuyup kimin Büyü İmparatoru olacağını görmeye söz verirler. Ne var ki yıllar geçtikçe ikisinin arasındaki fark uçurumlara dönüşür. Yuno'nun büyü konusunda 10 parmağında 10 marifet varken Asta büyü bile kullanamaz ve bu sebeple fiziksel antrenmanlara yönelir. Pes etmek nedir bilmeyen Asta bir gün inanılmaz bir güç elde eder ve iki arkadaş aynı amacın peşinde yola koyulur.",numberOfSeasons:2,tmdbScore:8.5,id:"7241415865961287681"},{type:"tv",malID:54492,pictures:{banner:"https://image.tmdb.org/t/p/original/gffVOVZ2Y9cmVIZ26Gt9ByMGCYH.jpg",avatar:"https://image.tmdb.org/t/p/original/sJZcy8QsOPuRPiCfoCWVB3r9Ohg.jpg"},romaji:"Kusuriya no Hi
