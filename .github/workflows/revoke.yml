name: '⚠️ Geri Çek'

# Sorunlu bir sürümü geri çeker (dosyaları silmez):
#   1. Release'in başına "⚠️ Geri çekildi" uyarısı yazılır, prerelease yapılır
#      (Latest rozeti kalkar).
#   2. Kanal manifesti (updater/latest-<kanal>.json) bu sürümü gösteriyorsa,
#      aynı kanaldaki bir önceki SAĞLAM sürüme döndürülür; yoksa stable
#      manifestine düşülür. Böylece yeni kullanıcılar bozuk sürümü almaz.
#      (Sürümü zaten kurmuş olanlar daha yüksek sürümde kaldığı için geri
#      düşürülmez — düzeltme yeni bir sürümle gelir.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Geri çekilecek sürüm (örn: 1.1.3-beta.1)'
        required: true
        type: string
      reason:
        description: 'Sebep (release notunda gösterilir)'
        required: false
        type: string
        default: ''

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - name: Geri çek
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          TAG="v${VERSION}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|alpha)\.[0-9]+)?$ ]]; then
            echo "::error::Geçersiz sürüm: $INPUT_VERSION"; exit 1
          fi
          case "$VERSION" in
            *-beta.*)  CHANNEL=beta ;;
            *-alpha.*) CHANNEL=alpha ;;
            *)         CHANNEL=stable ;;
          esac

          REL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")" \
            || { echo "::error::${TAG} için yayınlanmış release bulunamadı."; exit 1; }
          BODY="$(printf '%s' "$REL" | jq -r '.body // ""')"

          # 1) Release notu + prerelease
          if printf '%s' "$BODY" | head -c 200 | grep -q '⚠️ Geri çekildi'; then
            echo "Release zaten geri çekilmiş, not eklenmedi."
          else
            {
              echo "> ⚠️ **Geri çekildi** — bu sürüm sorun nedeniyle önerilmiyor.${REASON:+ Sebep: ${REASON}}"
              echo "> Lütfen daha yeni bir sürüm kullanın."
              echo
              printf '%s\n' "$BODY"
            } > notes.md
          fi
          if [ -f notes.md ]; then
            gh release edit "$TAG" --prerelease --latest=false --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$TAG" --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          fi
          echo "✅ ${TAG} geri çekildi olarak işaretlendi."

          # 2) Kanal manifesti bu sürümü gösteriyor mu?
          FILE="updater/latest-${CHANNEL}.json"
          CUR="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" 2>/dev/null | jq -r '.version // empty' || true)"
          if [ "$CUR" != "$VERSION" ]; then
            echo "Kanal manifesti (${CUR:-yok}) bu sürümü göstermiyor; değişiklik gerekmiyor."
            exit 0
          fi

          # Aynı kanalda, geri çekilmemiş, bu sürümden KÜÇÜK en yüksek sürüm.
          case "$CHANNEL" in
            stable) pat='^v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            *)      pat="^v[0-9]+\\.[0-9]+\\.[0-9]+-${CHANNEL}\\.[0-9]+\$" ;;
          esac
          CANDS="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg pat "$pat" --arg self "$TAG" '
                [.[][] | select(.draft == false and .tag_name != $self
                                and (.tag_name | test($pat))
                                and ((.body // "") | contains("⚠️ Geri çekildi") | not))
                       | .tag_name] | .[]')"
          PREV=""
          while read -r c; do
            [ -n "$c" ] || continue
            lowest="$(printf '%s\n%s\n' "${c#v}" "$VERSION" | sort -V | head -n1)"
            [ "$lowest" = "${c#v}" ] || continue            # c < VERSION olmalı
            if [ -z "$PREV" ] || [ "$(printf '%s\n%s\n' "${PREV#v}" "${c#v}" | sort -V | tail -n1)" = "${c#v}" ]; then
              PREV="$c"
            fi
          done <<< "$CANDS"

          mkdir -p dl
          if [ -n "$PREV" ] && gh release download "$PREV" -p latest.json -D dl --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "Kanal manifesti ${PREV} sürümüne döndürülüyor."
          else
            echo "Önceki sağlam ${CHANNEL} sürümü bulunamadı; stable manifestine düşülüyor."
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GITHUB_REPOSITORY}/contents/updater/latest-stable.json?ref=main" > dl/latest.json
          fi
          jq -e '.version and .platforms' dl/latest.json >/dev/null \
            || { echo "::error::Döndürülecek manifest geçersiz."; exit 1; }

          CONTENT="$(base64 -w0 dl/latest.json)"
          for attempt in 1 2 3; do
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq .sha)"
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}" \
                 -f "message=chore(updater): ${TAG} geri çekildi, ${CHANNEL} manifesti ${PREV:-stable} olarak döndürüldü [skip ci]" \
                 -f "content=${CONTENT}" -f "branch=main" -f "sha=${SHA}" >/dev/null; then
              echo "✅ ${FILE} geri alındı."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Kanal manifesti geri yazılamadı."
          exit 1
