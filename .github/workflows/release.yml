name: '🚀 Publish'

# Tek form, tek yol: Actions → Publish → Run workflow.
# (Tag push ile yayın YOK — sürüm daima bu formdan çıkar.)
#
#   kanal      : beta (varsayılan) | alpha | stable
#   sürüm      : boş = otomatik (scripts/next-version.sh); doluysa override
#   notlar     : `;` ile ayrılmış maddeler. Stable'da ZORUNLU.
#                Örn: Oynatıcı hızlandı; Altyazı kayması düzeltildi
#   platformlar: all | windows-only  (stable her zaman all)
#   dry_run    : işaretliyse yalnızca "ne yayınlanırdı?" özeti yazar, hiçbir
#                şey derlenmez/yayınlanmaz.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Kanal'
        required: true
        type: choice
        default: beta
        options:
          - beta
          - alpha
          - stable
      version:
        description: 'Sürüm (boş = otomatik). Override örn: 1.2.0 / 1.2.0-beta.1'
        required: false
        type: string
        default: ''
      notes:
        description: 'Sürüm notları — maddeleri ; ile ayır (stable için zorunlu)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Platformlar (stable her zaman hepsi)'
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-only
      dry_run:
        description: 'Sadece önizle (hiçbir şey yayınlama)'
        required: true
        type: boolean
        default: false

concurrency:
  # Yayınlar sıraya girer; devam eden bir yayın YARIDA KESİLMEZ (release/tag ve
  # manifest commit'i atomik olmayan işlemler).
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ────────────────────────────────────────────────────
  # 1) Sürüm, kanal, notlar, platform matrisi — ve ön kontroller
  # ────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      notes: ${{ steps.meta.outputs.notes }}
      matrix: ${{ steps.meta.outputs.matrix }}
      required_keys: ${{ steps.meta.outputs.required_keys }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Sürüm betiği testleri
        run: bash scripts/next-version.test.sh

      - name: Sürüm ve kanalı hesapla
        id: meta
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          PLATFORMS: ${{ inputs.platforms }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Notlar: baştaki/sondaki boşluk ve boş maddeler atılır.
          clean_notes=""
          IFS=';' read -ra items <<< "$NOTES"
          for it in "${items[@]:-}"; do
            it="$(printf '%s' "$it" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            [ -n "$it" ] || continue
            clean_notes="${clean_notes:+$clean_notes;}$it"
          done

          if [ "$CHANNEL" = "stable" ] && [ -z "$clean_notes" ]; then
            echo "::error::Stable yayında sürüm notu ZORUNLU (notlar alanını doldurun; maddeleri ; ile ayırın)."
            exit 1
          fi

          TAG="$(bash scripts/next-version.sh "$CHANNEL" "$INPUT_VERSION")"
          VERSION="${TAG#v}"

          # Aynı tag zaten varsa yayın BAŞLAMADAN dur (derleme boşa gitmesin).
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::${TAG} etiketi zaten var. Farklı bir sürüm girin ya da boş bırakıp otomatik hesaplatın."
            exit 1
          fi

          if [ "$CHANNEL" = "stable" ]; then PRE=false; PLATFORMS=all; else PRE=true; fi

          WIN='{"platform":"windows-latest","args":"","target":"x86_64-pc-windows-msvc","rust_targets":"","label":"Windows-x64"}'
          MAC='{"platform":"macos-latest","args":"--target universal-apple-darwin","target":"universal-apple-darwin","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","label":"macOS-Universal"}'
          LIN='{"platform":"ubuntu-latest","args":"","target":"x86_64-unknown-linux-gnu","rust_targets":"","label":"Linux-x64"}'
          if [ "$PLATFORMS" = "windows-only" ]; then
            MATRIX="{\"include\":[$WIN]}"
            KEYS="windows-x86_64"
          else
            MATRIX="{\"include\":[$WIN,$MAC,$LIN]}"
            KEYS="windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64"
          fi

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRE"
            echo "notes=$clean_notes"
            echo "matrix=$MATRIX"
            echo "required_keys=$KEYS"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

          {
            if [ "$DRY_RUN" = "true" ]; then echo "### 🔍 Önizleme (hiçbir şey yayınlanmadı)"; else echo "### 🚀 Yayın Bilgisi"; fi
            echo "- **Tag:** \`$TAG\`"
            echo "- **Kanal:** \`$CHANNEL\` (prerelease=$PRE)"
            echo "- **Platformlar:** \`$PLATFORMS\`"
            echo "- **Notlar:**"
            if [ -n "$clean_notes" ]; then
              IFS=';' read -ra n <<< "$clean_notes"
              for x in "${n[@]}"; do echo "  - $x"; done
            else
              echo "  - _(girilmedi)_"
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "Yayınlamak için aynı ayarlarla çalıştırın, **Sadece önizle** kutusunu kaldırın."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────
  # 2) Taslak release'i ÖNCEDEN aç (paralel işlerin aynı tag'i yaratıp 422
  #    almasını önler; id POST yanıtından okunur, listeye güvenilmez).
  # ────────────────────────────────────────────────────
  create-release:
    needs: prepare
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - name: Taslak release'i oluştur (varsa yeniden kullan)
        id: mk
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Taslaklar `releases/tags/<tag>` ile bulunamaz; liste üzerinden aranır.
          # `head -1` KULLANILMAZ (pipefail altında SIGPIPE adımı düşürür).
          find_id() {
            local out
            out="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                   | jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | .[0] // empty')" \
              || return 1
            printf '%s' "${out%%$'\n'*}"
          }
          find_id_retry() {
            local id delay
            for delay in 0 2 4 8 15; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              id="$(find_id || true)"
              if [ -n "$id" ]; then printf '%s' "$id"; return 0; fi
            done
          }

          ID="$(find_id || true)"
          if [ -z "$ID" ]; then
            if RESPONSE="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                 -f "tag_name=$TAG" \
                 -f "name=$TAG" \
                 -f "target_commitish=$GITHUB_SHA" \
                 -F draft=true \
                 -F "prerelease=$PRERELEASE" \
                 -f 'body=Otomatik yayın — varlıklar yükleniyor…')"; then
              ID="$(printf '%s' "$RESPONSE" | jq -r '.id // empty')"
            else
              echo "Release oluşturma isteği reddedildi, mevcut release aranıyor…"
              ID="$(find_id_retry)"
            fi
          fi

          if [ -z "$ID" ]; then
            echo "::error::Taslak release oluşturulamadı."
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Taslak release id: $ID"

  # ────────────────────────────────────────────────────
  # 3) Derle + TASLAK release'e yükle (seçilen platformlar paralel)
  #    Yalnızca release derlemesi — debug build artık yayına girmez.
  # ────────────────────────────────────────────────────
  build:
    needs: [prepare, create-release]
    permissions:
      contents: write
    strategy:
      # Bir platform patlarsa diğerlerinin sonucunu da görmek istiyoruz;
      # eksik platformu manifest işi yakalıyor.
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      # macOS universal: iki rustup hedefi de gerekli (lipo ile birleştirilir).
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      - name: Cache Tauri bundler (NSIS, Wix etc.)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json', 'src-tauri/tauri.windows.conf.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Paketin, ikilinin ve updater manifestinin sürümü eşit olmak zorunda;
      # depodaki değer ne olursa olsun formdaki sürüm kazanır.
      - name: Sürüm alanlarını eşitle
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install frontend dependencies
        run: bun install

      # İMZALI derleme: createUpdaterArtifacts=true → .sig üretilir. Secret
      # yoksa manifest işi BİLEREK patlar.
      # macOS universal: tauri-action latest.json'a darwin-aarch64 ve
      # darwin-x86_64 anahtarlarını (aynı dosya) yazar; updater `darwin-universal`
      # aramaz, bu yüzden iki anahtar da gerekli.
      - name: Build & Upload (imzalı)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --verbose

  # ────────────────────────────────────────────────────
  # 4) Çok platformlu updater manifesti (notlarıyla) kur ve doğrula
  # ────────────────────────────────────────────────────
  updater-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Manifesti üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          # Updater diyaloğunda gösterilecek düz metin: maddeler satır satır.
          if [ -n "$NOTES" ]; then
            UPDATER_NOTES="$(printf '%s' "$NOTES" | tr ';' '\n' | sed 's/^/• /')"
          else
            UPDATER_NOTES="$TAG sürümü"
          fi
          bash scripts/build-updater-manifest.sh "$TAG" "$VERSION" latest.json "$UPDATER_NOTES"

      # Seçilen platformların hepsi manifeste girmeli; eksik anahtar = o
      # platformdaki kullanıcı güncelleme almaz. Sessizce geçilmez.
      - name: Gerekli platformlar var mı?
        env:
          KEYS: ${{ needs.prepare.outputs.required_keys }}
        run: |
          missing=0
          for key in $KEYS; do
            if ! jq -e --arg k "$key" '.platforms[$k].url' latest.json >/dev/null; then
              echo "::error::Manifestte $key eksik"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Manifesti release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" latest.json \
            --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json

  # ────────────────────────────────────────────────────
  # 5) Taslağı canlıya al: "Yenilikler" + indirme rehberi.
  #    Stable → Latest; beta/alpha → prerelease.
  # ────────────────────────────────────────────────────
  publish-release:
    needs: [prepare, build, updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sürüm notunu yaz ve yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOTES: ${{ needs.prepare.outputs.notes }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          case "$CHANNEL" in
            stable) chan_tr="Stable (kararlı sürüm)" ;;
            beta)   chan_tr="Beta (yeni özellikler erken gelir, küçük sorunlar olabilir)" ;;
            alpha)  chan_tr="Alpha (deneysel, her an bozulabilir)" ;;
          esac

          {
            echo "## 🚀 OpenAnime ${TAG}"
            echo
            echo "> **Kanal:** ${chan_tr}"
            echo
            if [ -n "$NOTES" ]; then
              echo "### ✨ Yenilikler"
              IFS=';' read -ra items <<< "$NOTES"
              for it in "${items[@]}"; do echo "- $it"; done
              echo
            fi
            echo "### 📥 Hangi dosyayı indirmeliyim?"
            echo "| İşletim sistemin | İndireceğin dosya |"
            echo "|---|---|"
            echo "| 🪟 Windows 10/11 (64-bit) | \`OpenAnime_${VERSION}_x64-setup.exe\` |"
            echo "| 🍎 macOS (Apple Silicon & Intel) | \`OpenAnime_${VERSION}_universal.dmg\` |"
            echo "| 🐧 Linux | \`OpenAnime_${VERSION}_amd64.AppImage\` veya \`.deb\` |"
            echo
            echo "<details>"
            echo "<summary>📁 Diğer dosyalar ne işe yarar?</summary>"
            echo
            echo "| Dosya | Açıklama |"
            echo "|---|---|"
            echo "| \`*.app.tar.gz\` | Uygulama içi otomatik güncelleyicinin (macOS) kullandığı paket |"
            echo "| \`*.sig\` | Güncelleme paketlerinin dijital imzaları — elle indirilmez |"
            echo "| \`latest.json\` | Otomatik güncelleme manifesti |"
            echo
            echo "</details>"
          } > release-notes.md

          if [ "$PRERELEASE" = "true" ]; then
            LATEST_FLAG="--latest=false"; PRE_FLAG="--prerelease"
          else
            LATEST_FLAG="--latest"; PRE_FLAG="--prerelease=false"
          fi

          gh release edit "$TAG" \
            --draft=false \
            $PRE_FLAG $LATEST_FLAG \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}"

  # ────────────────────────────────────────────────────
  # 6) Kanal manifestini main'e yaz (GitHub API → "Verified" commit).
  #    Yalnızca yayınlanan kanalın dosyası güncellenir.
  # ────────────────────────────────────────────────────
  update-channel-manifest:
    needs: [prepare, updater-manifest, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Birleştirilmiş manifesti indir
        uses: actions/download-artifact@v7
        with:
          name: updater-manifest
          path: manifest-artifact

      - name: Kanal dosyasını commit'le
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          FILE="updater/latest-${CHANNEL}.json"
          CONTENT="$(base64 -w0 manifest-artifact/latest.json)"
          for attempt in 1 2 3; do
            SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=main" --jq .sha 2>/dev/null || true)"
            args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${FILE}"
                  -f "message=chore(updater): ${CHANNEL} kanal manifestini ${TAG} olarak güncelle [skip ci]"
                  -f "content=${CONTENT}" -f "branch=main")
            [ -n "$SHA" ] && args+=(-f "sha=${SHA}")
            if gh api "${args[@]}" >/dev/null; then
              echo "✅ ${FILE} güncellendi (${TAG})"
              exit 0
            fi
            echo "Deneme $attempt başarısız (eşzamanlı değişiklik olabilir), yeniden…"
            sleep $((attempt * 3))
          done
          echo "::error::Kanal manifesti main'e yazılamadı."
          exit 1

  # ────────────────────────────────────────────────────
  # 7) Hata/iptal olursa YARIM kalan TASLAK release'i sil.
  #    Yayınlanmış (draft=false) bir release'e asla dokunmaz.
  # ────────────────────────────────────────────────────
  cleanup:
    needs: [create-release, build, updater-manifest, publish-release, update-channel-manifest]
    if: ${{ always() && (failure() || cancelled()) && needs.create-release.outputs.release_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Taslak release'i temizle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          DRAFT="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}" --jq .draft 2>/dev/null || echo gone)"
          if [ "$DRAFT" = "true" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${ID}"
            echo "🧹 Yarım kalan taslak release silindi (id=${ID})."
          else
            echo "Release taslak değil ($DRAFT); dokunulmadı."
          fi
