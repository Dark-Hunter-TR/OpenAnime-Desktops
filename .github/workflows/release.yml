name: '🚀 Publish'

# Tag push edildiğinde otomatik build + yayın.
# Veya GitHub Actions arayüzünden manuel trigger.
# Kanal, tag'in ön-sürüm son ekinden türetilir:
#   v1.0.0          -> stable
#   v1.1.0-beta.1   -> beta
#   v1.2.0-alpha.1  -> alpha
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - beta
          - alpha
      version:
        description: 'Version (ör: 1.0.0, 1.1.0)'
        required: true
        type: string

concurrency:
  # Aynı tag için tek yayın; devam eden bir yayını YARIDA KESME (release/tag
  # silme ve manifest commit'i atomik olmayan işlemler).
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  # ────────────────────────────────────────────────────
  # 1) Tag'den sürüm + kanal türet
  # ────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Sürüm ve kanalı tag'den hesapla
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Ön-sürüm sayacı: v<base>-<chan>.<N> tag'lerinin en yüksek N'sini bulup
          # N+1 döndürür. Eşleşen tag yoksa 1. Sayaç baz sürüm başına resetlenir
          # (v1.1.3-alpha.1 -> v1.1.3-alpha.2; yeni baz 1.1.4 -> alpha.1).
          next_prerelease_n() {
            local base="$1" chan="$2" max=0 ref name n
            while IFS= read -r ref; do
              name="${ref#refs/tags/v}"
              case "$name" in
                "${base}-${chan}."*)
                  n="${name##*.}"
                  case "$n" in ''|*[!0-9]*) ;; *) [ "$n" -gt "$max" ] && max="$n" ;; esac
                  ;;
              esac
            done < <(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${base}-${chan}." \
                       --jq '.[].ref' 2>/dev/null || true)
            echo $((max + 1))
          }

          # workflow_dispatch veya push'dan tag'ı al
          if [ -z "$INPUT_CHANNEL" ]; then
            # push: event'i — GITHUB_REF_NAME'den tag'ı parse et
            TAG="${GITHUB_REF_NAME}"
          else
            # workflow_dispatch — channel + version'dan tag'ı oluştur
            VERSION="$INPUT_VERSION"
            case "$INPUT_CHANNEL" in
              stable) TAG="v${VERSION}" ;;
              beta)   TAG="v${VERSION}-beta.$(next_prerelease_n "$VERSION" beta)" ;;
              alpha)  TAG="v${VERSION}-alpha.$(next_prerelease_n "$VERSION" alpha)" ;;
            esac
          fi
          VERSION="${TAG#v}"            # baştaki 'v' atılır

          # SemVer doğrulama (yalnızca -beta / -alpha ön-sürümlerine izin ver)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag SemVer değil: $TAG (beklenen: v1.2.3 veya v1.2.3-beta.1)"
            exit 1
          fi

          case "$VERSION" in
            *-beta*)  CHANNEL=beta ;;
            *-alpha*) CHANNEL=alpha ;;
            *-*)      echo "::error::Desteklenmeyen ön-sürüm son eki: $VERSION (yalnızca -beta / -alpha)"; exit 1 ;;
            *)        CHANNEL=stable ;;
          esac

          if [ "$CHANNEL" = "stable" ]; then PRE=false; else PRE=true; fi

          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"   >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"   >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE"    >> "$GITHUB_OUTPUT"

          {
            echo "### 🚀 Yayın Bilgisi"
            echo "- **Tag:** \`$TAG\`"
            echo "- **Sürüm:** \`$VERSION\`"
            echo "- **Kanal:** \`$CHANNEL\` (prerelease=$PRE)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────
  # 2) Taslak release'i ÖNCEDEN aç
  #
  # Üç platform paralel derlendiği için bu adım şart: `tauri-action` release
  # yoksa kendisi oluşturuyor ve aynı anda başlayan üç iş aynı tag'i yaratmaya
  # çalışınca biri 422 ile düşüyor. Release'i burada tek seferde açıp aşağıya
  # yalnızca `releaseId` geçiyoruz.
  # ────────────────────────────────────────────────────
  create-release:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.mk.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7

      - name: Taslak release'i oluştur (varsa yeniden kullan)
        id: mk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # Taslak release'ler `releases/tags/<tag>` ile BULUNAMIYOR (o uç nokta
          # yalnızca yayınlanmışlara bakıyor); bu yüzden liste üzerinden arıyoruz.
          #
          # Ama liste uç noktası ANINDA TUTARLI DEĞİL: yeni açılan bir taslak
          # birkaç saniye boyunca listede görünmeyebiliyor. Release'i açıp hemen
          # ardından listede aramak tam da bu yüzden "oluşturulamadı" diye
          # düşüyordu — release aslında oluşmuştu.
          #
          # Çözüm: id'yi aramıyoruz, release'i oluşturan POST'un YANITINDAN
          # okuyoruz (`gh release create` yalnızca URL basıyor, id vermiyor;
          # bu yüzden REST uç noktasını doğrudan çağırıyoruz). Listeye artık
          # sadece "bu tag için taslak zaten var mı" kontrolü ve paralel bir işin
          # release'i önce açtığı yarış durumu için başvuruyoruz.
          find_id() {
            # `head -1` YOK: pipefail altında SIGPIPE (141) adımı sessizce
            # düşürüyor. Tüm çıktıyı alıp ilk satırı bash içinde ayıklıyoruz.
            local out
            out="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                   | jq -r --arg tag "$TAG" '[.[][] | select(.tag_name == $tag) | .id] | .[0] // empty')" \
              || return 1
            printf '%s' "${out%%$'\n'*}"
          }

          # Yukarıdaki gecikmeye karşı artan beklemeyle yeniden dener.
          find_id_retry() {
            local id delay
            for delay in 0 2 4 8 15; do
              [ "$delay" -eq 0 ] || sleep "$delay"
              id="$(find_id || true)"
              if [ -n "$id" ]; then printf '%s' "$id"; return 0; fi
            done
          }

          ID="$(find_id || true)"

          if [ -z "$ID" ]; then
            if RESPONSE="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
                 -f "tag_name=$TAG" \
                 -f "name=$TAG" \
                 -f "target_commitish=$GITHUB_SHA" \
                 -F draft=true \
                 -F "prerelease=$PRERELEASE" \
                 -f 'body=Otomatik yayın — varlıklar yükleniyor…')"; then
              ID="$(printf '%s' "$RESPONSE" | jq -r '.id // empty')"
            else
              # 422 already_exists: aynı tag için release başka bir yerde
              # açılmış olabilir. Listede belirmesini bekleyip yeniden ara.
              echo "Release oluşturma isteği reddedildi, mevcut release aranıyor…"
              ID="$(find_id_retry)"
            fi
          fi

          if [ -z "$ID" ]; then
            echo "::error::Taslak release oluşturulamadı."
            exit 1
          fi
          echo "release_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Taslak release id: $ID"

  # ────────────────────────────────────────────────────
  # 3) Derle + TASLAK release'e yükle (Windows + macOS + Linux paralel)
  # ────────────────────────────────────────────────────
  build:
    needs: [prepare, create-release]
    permissions:
      contents: write
    strategy:
      # Bir platform patlarsa diğerlerinin sonucunu da görmek istiyoruz;
      # eksik platformu aşağıdaki manifest işi zaten yakalıyor.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            debug_args: ''
            target: x86_64-pc-windows-msvc
            rust-targets: ''
            label: Windows-x64
          # macOS: universal binary (Intel + Apple Silicon tek .app/.dmg içinde).
          # tauri-cli, aarch64 ve x86_64 hedeflerini AYRI AYRI derleyip `lipo` ile
          # birleştirir — bu yüzden iki rustup target'ı da kurulu olmak zorunda
          # (aşağıdaki `rust-targets`). Debug derlemesi bilerek universal DEĞİL:
          # yalnızca test amaçlı olduğu için CI süresini iki katına çıkarmaya değmez.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            debug_args: ''
            target: universal-apple-darwin
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            label: macOS-Universal
          - platform: ubuntu-latest
            args: ''
            debug_args: ''
            target: x86_64-unknown-linux-gnu
            rust-targets: ''
            label: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tauri v2 (webkit2gtk-4.1) + native_player (gtk4 + wgpu) için sistem
      # bağımlılıkları. libegl1-mesa-dev: wgpu'nun GLES arka ucu (Vulkan ash
      # ile dinamik yüklenir, ama EGL için başlık gerekebilir).
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libegl1-mesa-dev \
            pkg-config

      # Toolchain + sccache
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x

      # Cache
      - name: Cache Tauri bundler (NSIS, Wix etc.)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('src-tauri/tauri.conf.json', 'src-tauri/tauri.windows.conf.json') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Sürüm alanları derlemeden ÖNCE yazılıyor: paketin, ikilinin ve updater
      # manifestinin sürümü birbirine uymak zorunda. Depodaki değer ne olursa
      # olsun tag kazanır. `Cargo.lock` da güncelleniyor (bkz. scripts/set-version.mjs)
      # — aksi hâlde lock dosyası "güncel değil" diye ayrı bir sorun çıkarabilir.
      - name: Sürüm alanlarını tag ile eşitle
        shell: bash
        run: node scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Install frontend dependencies
        run: bun install

      # Stable: İMZALI derleme. tauri-action createUpdaterArtifacts=true olduğu
      # için latest.json + .sig üretir. İmzalama secret'ları ZORUNLU; yoksa
      # updater manifesti üretilmez ve aşağıdaki manifest işi BİLEREK patlar.
      #
      # macOS universal notu: tauri-action, universal bir .app.tar.gz gördüğünde
      # latest.json'a HEM darwin-aarch64 HEM darwin-x86_64 anahtarlarını (aynı
      # dosyayı işaret ederek) yazar. Updater istemcisi çalışma anında yalnızca
      # `darwin-{arch}` arar, `darwin-universal` diye bir geri düşüş YOKTUR —
      # yani tek universal paket her iki mimarideki kullanıcıya da ulaşır.
      - name: Build & Publish (Stable, imzalı)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }} --verbose

      # Debug sürümü: tauri.debug.conf.json ile override.
      #   - createUpdaterArtifacts=false -> imza yok, bu yüzden imza anahtarı VERİLMEZ
      #   - productName="OpenAnime-Debug" -> dosya adı stable'dan farklı olur, üzerine yazmaz
      - name: Build & Publish (Debug)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --debug --config src-tauri/tauri.debug.conf.json ${{ matrix.debug_args }} --verbose

  # ────────────────────────────────────────────────────
  # 4) Çok platformlu updater manifestini kur ve doğrula
  #
  # tauri-action her işte kendi latest.json'unu yükleyip diğerlerini eziyor;
  # bu yüzden manifesti release varlıklarından yeniden kuruyoruz
  # (bkz. scripts/build-updater-manifest.sh).
  # ────────────────────────────────────────────────────
  updater-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Manifesti üret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-updater-manifest.sh \
            "${{ needs.prepare.outputs.tag }}" \
            "${{ needs.prepare.outputs.version }}" \
            latest.json

      # Üç platformun da manifeste girdiğini doğruluyoruz. Eksik bir anahtar,
      # o platformdaki kullanıcının hiç güncelleme almaması demek — sessizce
      # geçilecek bir durum değil.
      - name: Bütün platformlar var mı?
        run: |
          missing=0
          for key in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            if ! jq -e --arg k "$key" '.platforms[$k].url' latest.json >/dev/null; then
              echo "::error::Manifestte $key eksik"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Manifesti release'e yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" latest.json \
            --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: updater-manifest
          path: latest.json

  # ────────────────────────────────────────────────────
  # 5) Taslak release'i canlıya al
  # ────────────────────────────────────────────────────
  publish-release:
    needs: [prepare, build, updater-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Taslağı yayınla
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.prepare.outputs.tag }}" \
            --draft=false \
            --repo "${{ github.repository }}"

  # ────────────────────────────────────────────────────
  # 6) Kanal manifestini main'e commit'le
  #
  # Uygulama bu dosyaları okuyor: updater/latest-<kanal>.json
  # (bkz. src-tauri/src/updater.rs). Yalnızca YAYINLANAN kanalın dosyası
  # güncelleniyor — Stable kanalı seçen kullanıcının alpha/beta sürümü
  # görmemesinin tek ve yeterli sebebi bu.
  # ────────────────────────────────────────────────────
  update-channel-manifest:
    needs: [prepare, updater-manifest, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Birleştirilmiş manifesti indir
        uses: actions/download-artifact@v7
        with:
          name: updater-manifest
          path: manifest-artifact

      - name: Kanal dosyasına yerleştir
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          mkdir -p updater
          cp manifest-artifact/latest.json "updater/latest-${CHANNEL}.json"
          rm -rf manifest-artifact

      - name: Değişikliği main'e commit'le
        env:
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ -f "updater/latest-${CHANNEL}.json" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "updater/latest-${CHANNEL}.json"
            git commit -m "chore(updater): ${CHANNEL} kanal manifestini ${TAG} olarak güncelle [skip ci]" \
              || echo "Değişiklik yok, commit edilmedi."
            git push origin main || { echo "::error::git push başarısız oldu"; exit 1; }
          else
            echo "::error::Kanal manifesti hazırlanamadı."
            exit 1
          fi
