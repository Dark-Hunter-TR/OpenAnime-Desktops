name: '🧪 Test Build'

# Hızlı deneme derlemesi. Yayın YAPMAZ: tag/release/manifest'e dokunmaz,
# imza anahtarı kullanmaz. Çıktı her zaman artifact olarak yüklenir (7 gün).
# Sürüm: <depodaki baz sürüm>-test.<çalıştırma no>
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        type: choice
        default: all
        options:
          - all
          - windows-latest
          - macos-latest
          - ubuntu-latest
      build_mode:
        description: 'Mod (test-release = hızlı, release = tam optimizasyon, debug)'
        required: true
        type: choice
        default: test-release
        options:
          - test-release
          - release
          - debug

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Sürüm ve matris
        id: meta
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          MODE: ${{ inputs.build_mode }}
        run: |
          set -euo pipefail
          BASE="$(node -p "require('./package.json').version.split('-')[0]")"
          VERSION="${BASE}-test.${GITHUB_RUN_NUMBER}"

          WIN='{"platform":"windows-latest","args":"","target":"","rust_targets":"","label":"Windows-x64","bundle":"src-tauri/target"}'
          MAC='{"platform":"macos-latest","args":"--target universal-apple-darwin","target":"universal-apple-darwin","rust_targets":"aarch64-apple-darwin,x86_64-apple-darwin","label":"macOS-Universal","bundle":"src-tauri/target/universal-apple-darwin"}'
          LIN='{"platform":"ubuntu-latest","args":"","target":"","rust_targets":"","label":"Linux-x64","bundle":"src-tauri/target"}'
          case "$PLATFORM" in
            windows-latest) M="$WIN" ;;
            macos-latest)   M="$MAC" ;;
            ubuntu-latest)  M="$LIN" ;;
            *)              M="$WIN,$MAC,$LIN" ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "matrix={\"include\":[$M]}" >> "$GITHUB_OUTPUT"
          {
            echo "### 🧪 Test Build"
            echo "- **Sürüm:** \`$VERSION\`"
            echo "- **Platform:** \`$PLATFORM\` · **Mod:** \`$MODE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    env:
      MODE: ${{ inputs.build_mode }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-4-dev \
            libglib2.0-dev \
            libegl1-mesa-dev \
            pkg-config

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Tauri bundler (NSIS, Wix etc.)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\tauri
          key: windows-tauri-bundler
          restore-keys: |
            windows-tauri-bundler-

      - name: Cache Rust dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.label }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.label }}-cargo-

      - name: Cache Bun
        uses: actions/cache@v6
        with:
          path: ~/.bun
          key: ${{ matrix.label }}-bun-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            ${{ matrix.label }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Sürüm alanlarını eşitle
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION"

      # `--target` MUTLAKA `--` ayracından önce: sonrası doğrudan cargo'ya gider.
      # tauri.test.conf.json updater artifact'larını kapatır → imza gerekmez.
      - name: Build
        uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }} --config src-tauri/tauri.test.conf.json ${{ inputs.build_mode == 'debug' && '--debug' || inputs.build_mode == 'test-release' && '-- --profile test-release' || '' }} --verbose

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.label }}-${{ inputs.build_mode }}
          path: ${{ matrix.bundle }}/${{ inputs.build_mode }}/bundle
          if-no-files-found: warn
          retention-days: 7
